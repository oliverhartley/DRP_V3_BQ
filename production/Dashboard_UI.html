<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --background-color: #f8f9fa;
            --surface-color: #ffffff;
            --border-color: #dadce0;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            
            --sol-infra: #fce5cd;
            --sol-app: #d9d2e9;
            --sol-data: #d9ead3;
            --sol-ai: #c9daf8;
            --sol-sec: #f4cccc;
            --sol-ws: #fff2cc;
        }

        body {
            font-family: 'Google Sans', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
            color: var(--text-primary);
        }

        .header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }

        .sidebar {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 200px;
            flex: 1;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background-color: #fff;
            cursor: pointer;
            outline: none;
        }
        
        select:focus {
            border-color: var(--primary-color);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: var(--text-secondary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: #f1f3f4;
            font-weight: 500;
            position: sticky;
            top: 0;
        }

        .score-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin: 2px;
            background-color: #e8eaed;
        }

        .sol-Infrastructure { background-color: var(--sol-infra); }
        .sol-Application { background-color: var(--sol-app); }
        .sol-Data { background-color: var(--sol-data); }
        .sol-Artificial { background-color: var(--sol-ai); }
        .sol-Security { background-color: var(--sol-sec); }
        .sol-Workspace { background-color: var(--sol-ws); }

    </style>
</head>
<body>

    <div class="header">
        <h1>DRP Partner Dashboard 2026</h1>
        <div style="color: var(--text-secondary); font-size: 14px;">Collaborative filtering view.</div>
    </div>

    <div class="sidebar" id="filters" style="display: none;">
        <div class="filter-group">
            <label>Partner Type</label>
            <select id="filterType" onchange="applyFilters()"><option value="All">All Types</option></select>
        </div>
        <div class="filter-group">
            <label>Sub-Region</label>
            <select id="filterRegion" onchange="applyFilters()"><option value="All">All Regions</option></select>
        </div>
        <div class="filter-group">
            <label>PDM</label>
            <select id="filterPDM" onchange="applyFilters()"><option value="All">All PDMs</option></select>
        </div>
        <div class="filter-group">
            <label>Solution</label>
            <select id="filterSolution" onchange="applyFilters()"><option value="All">All Solutions</option></select>
        </div>
        <div class="filter-group">
            <label>Product</label>
            <select id="filterProduct" onchange="applyFilters()"><option value="All">All Products</option></select>
        </div>
    </div>

    <div id="loading" class="loading">
        Loading Data... Please wait.
    </div>

    <div id="tableContainer" style="display: none;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Partner Name</th>
                    <th>Sub-Region</th>
                    <th>PDM</th>
                    <th>Type</th>
                    <th>Profiles</th>
                    <th>Certifications / Tiers</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let allData = [];

        // Fetch data from Apps Script
        google.script.run.withSuccessHandler(initDashboard).withFailureHandler(showError).getDashboardData();

        function showError(error) {
            document.getElementById('loading').innerText = "Error loading data: " + error;
        }

        function initDashboard(response) {
            if (!response.success) {
                showError(response.message);
                return;
            }

            allData = response.data;
            const slicers = response.slicers;

            // Populate Dropdowns
            populateSelect('filterType', slicers.types);
            populateSelect('filterRegion', slicers.subRegions);
            populateSelect('filterPDM', slicers.pdms);
            populateSelect('filterSolution', slicers.solutions);
            populateSelect('filterProduct', slicers.products);

            document.getElementById('loading').style.display = 'none';
            document.getElementById('filters').style.display = 'flex';
            document.getElementById('tableContainer').style.display = 'block';

            applyFilters();
        }

        function populateSelect(id, items) {
            const select = document.getElementById(id);
            items.forEach(item => {
                if(item) select.insertAdjacentHTML('beforeend', `<option value="${item}">${item}</option>`);
            });
        }

        function applyFilters() {
            const t = document.getElementById('filterType').value;
            const r = document.getElementById('filterRegion').value;
            const p = document.getElementById('filterPDM').value;
            const s = document.getElementById('filterSolution').value;
            const pr = document.getElementById('filterProduct').value;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const filteredData = allData.filter(row => {
                let match = true;
                if (t !== 'All' && row.type !== t) match = false;
                if (r !== 'All' && row.subRegion !== r) match = false;
                if (p !== 'All' && row.pdm !== p) match = false;
                
                // Solution / Product filter logic uses the scores array
                if (s !== 'All' || pr !== 'All') {
                    const hasProduct = row.scores.some(score => {
                        let ok = true;
                        if (s !== 'All' && score.solution !== s) ok = false;
                        if (pr !== 'All' && score.product !== pr) ok = false;
                        return ok;
                    });
                    if (!hasProduct) match = false;
                }

                return match;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No partners match the selected filters.</td></tr>`;
                return;
            }

            filteredData.forEach(row => {
                let pillsHtml = '';
                row.scores.forEach(score => {
                    // Only show pills matching the solution/product filter if active
                    if ((s === 'All' || score.solution === s) && (pr === 'All' || score.product === pr)) {
                        const solClass = 'sol-' + score.solution.split(' ')[0]; // E.g., sol-Infrastructure
                        pillsHtml += `<span class="score-pill ${solClass}">${score.product} (${score.tier}): ${score.count}</span>`;
                    }
                });

                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td style="font-weight: 500;">${row.partnerName}</td>
                        <td>${row.subRegion}</td>
                        <td>${row.pdm}</td>
                        <td>${row.type}</td>
                        <td style="font-weight: bold;">${row.profiles}</td>
                        <td>${pillsHtml}</td>
                    </tr>
                `);
            });
        }
    </script>
</body>
</html>
